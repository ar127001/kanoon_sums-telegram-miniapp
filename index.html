<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="theme-color" content="#101827">

    <title>کانون‌های دانشگاه علوم پزشکی شیراز</title>

    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            padding: 35px 18px 30px;
            background:
                radial-gradient(ellipse at 50% 0%, #263b59 0%, transparent 55%),
                linear-gradient(160deg, #101827, #172536 55%, #101827);
            color: #ffffff;
            font-family: Tahoma, sans-serif;
            text-align: center;
        }

        .container {
            max-width: 680px;
            margin: auto;
        }

        /* Header */

        .header {
            margin-bottom: 32px;
        }

        .header-icon {
            width: 76px;
            height: 76px;
            margin: 0 auto 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 25px;
            background: linear-gradient(135deg, #328bd5, #6256c9);
            box-shadow: 0 10px 35px rgba(50, 139, 213, 0.25);
            font-size: 36px;
        }

        h1 {
            font-size: 21px;
            font-weight: 700;
            margin-bottom: 12px;
        }

        .subtitle {
            color: #a9b9ca;
            font-size: 12px;
            line-height: 2;
        }

        .header-line {
            width: 55px;
            height: 3px;
            margin: 20px auto 0;
            border-radius: 10px;
            background: linear-gradient(90deg, #328bd5, #8c79e8);
        }

        /* Section */

        .section-title {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 18px;
            padding: 0 3px;
        }

        .section-title h2 {
            font-size: 14px;
            font-weight: 600;
        }

        .count {
            color: #9bb9d8;
            background: rgba(65, 135, 205, 0.15);
            border: 1px solid rgba(100, 165, 225, 0.2);
            border-radius: 20px;
            padding: 6px 12px;
            font-size: 11px;
        }

        /* Grid */

        .grid {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 13px;
        }

        /* Cards */

        .item {
            min-width: 0;
            min-height: 132px;
            padding: 17px 7px 13px;
            border: 1px solid rgba(255, 255, 255, 0.075);
            border-radius: 19px;
            background: linear-gradient(
                145deg,
                rgba(255, 255, 255, 0.085),
                rgba(255, 255, 255, 0.025)
            );
            color: #ffffff;
            text-decoration: none;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            gap: 11px;
            cursor: pointer;
            transition:
                transform 0.2s ease,
                background 0.2s ease,
                border-color 0.2s ease,
                box-shadow 0.2s ease;
            -webkit-tap-highlight-color: transparent;
        }

        .item:hover {
            transform: translateY(-5px);
            background: rgba(58, 126, 190, 0.17);
            border-color: rgba(100, 170, 235, 0.4);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.15);
        }

        .item:active {
            transform: scale(0.96);
        }

        .icon {
            width: 59px;
            height: 59px;
            border-radius: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 29px;
            background: rgba(70, 140, 210, 0.17);
            border: 1px solid rgba(120, 175, 230, 0.12);
        }

        .item p {
            font-size: 11px;
            line-height: 1.9;
            font-weight: 500;
            color: #e5edf6;
            overflow-wrap: anywhere;
        }

        /* Footer */

        .footer {
            margin-top: 35px;
            padding-top: 20px;
            border-top: 1px solid rgba(255, 255, 255, 0.07);
            color: #7f91a5;
            font-size: 10px;
            line-height: 2;
        }

        .footer strong {
            color: #a9bfd5;
            font-weight: 500;
        }

        /* Responsive */

        @media (min-width: 550px) {
            .grid {
                grid-template-columns: repeat(4, minmax(0, 1fr));
                gap: 16px;
            }

            .item {
                min-height: 145px;
                padding-top: 20px;
            }

            .icon {
                width: 65px;
                height: 65px;
                font-size: 32px;
            }

            .item p {
                font-size: 12px;
            }
        }

        @media (max-width: 340px) {
            .grid {
                gap: 9px;
            }

            .item {
                min-height: 120px;
                padding-left: 4px;
                padding-right: 4px;
            }

            .icon {
                width: 53px;
                height: 53px;
                font-size: 26px;
            }

            .item p {
                font-size: 10px;
            }
        }

    </style>
</head>

<body>

    <div class="container">

        <!-- Header -->

        <header class="header">

            <div class="header-icon">🎓</div>

            <h1>درگاه کانون‌ها</h1>

            <div class="subtitle">
                دانشگاه علوم پزشکی شیراز
                <br>
                دنیایی از هنر، فرهنگ، اندیشه و فعالیت‌های دانشجویی
            </div>

            <div class="header-line"></div>

        </header>


        <!-- Channels Section -->

        <section>

            <div class="section-title">

                <h2>کانون‌های دانشگاه</h2>

                <span class="count">۱۵ کانون</span>

            </div>


            <div class="grid" id="channels"></div>

        </section>


        <!-- Footer -->

        <footer class="footer">

            <strong>کانون‌های فرهنگی و هنری دانشگاه علوم پزشکی شیراز</strong>

            <br>

            سامانه معرفی و دسترسی به کانال‌های کانون‌ها

        </footer>

    </div>


    <script>

        // Telegram Web App initialization

        const tg = window.Telegram?.WebApp;

        if (tg) {
            tg.ready();
            tg.expand();
        }


        // University cultural and student associations

        const channels = [

            {
                name: "کانون کتاب",
                icon: "📚",
                url: "https://t.me/sumsketab"
            },

            {
                name: "کانون نجوم",
                icon: "🔭",
                url: "https://t.me/Sums_Astronomy"
            },

            {
                name: "کانون شعر و ادب دچار",
                icon: "✒️",
                url: "https://t.me/dochar_sums"
            },

            {
                name: "کانون خانه سبز",
                icon: "🌱",
                url: "https://t.me/Sums_Green_House"
            },

            {
                name: "کانون خیریه طعم مهربانی",
                icon: "🫂",
                url: "https://t.me/taamemehr_sums"
            },

            {
                name: "کانون خیریه هم‌نبض",
                icon: "💌",
                url: "https://t.me/hamn_abzz"
            },

            {
                name: "کانون هلال احمر",
                icon: "🏥",
                url: "https://t.me/sumshelal"
            },

            {
                name: "مرکز رسانه",
                icon: "📸",
                url: "https://t.me/MediaCenter_sums"
            },

            {
                name: "کانون گردشگری",
                icon: "🏕️",
                url: "https://t.me/gardeshgari_sums"
            },

            {
                name: "کانون هنر",
                icon: "🎨",
                url: "https://t.me/kanoonhonar_sums"
            },

            {
                name: "کانون جهادی کیش اندیش",
                icon: "🤲",
                url: "https://t.me/Kishandish_sums"
            },

            {
                name: "کانون مهدویت",
                icon: "🕌",
                url: "https://t.me/tanha_nisti313"
            },

            {
                name: "کانون تئاتر",
                icon: "🎭",
                url: "https://t.me/kanoon_theatre"
            },

            {
                name: "کانون فیلم",
                icon: "🎥",
                url: "https://t.me/AnjomanFilmCh"
            },

            {
                name: "کانون موسیقی",
                icon: "🎼",
                url: "https://t.me/music_sums"
            }

        ];


        // Render channels

        const container = document.getElementById("channels");

        channels.forEach(channel => {

            const item = document.createElement("a");

            item.className = "item";
            item.href = channel.url;
            item.setAttribute("aria-label", channel.name);

            const icon = document.createElement("div");

            icon.className = "icon";
            icon.textContent = channel.icon;

            const name = document.createElement("p");

            name.textContent = channel.name;

            item.appendChild(icon);
            item.appendChild(name);


            // Open Telegram channel

            item.addEventListener("click", function(event) {

                if (tg) {
                    event.preventDefault();
                    tg.openTelegramLink(channel.url);
                }

            });

            container.appendChild(item);

        });

    </script>

</body>

</html>
