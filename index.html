
<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>کانون‌های فرهنگی و هنری دانشگاه علوم پزشکی شیراز</title>

    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 25px 18px 35px;
            background: #17212b;
            color: #ffffff;
            font-family: Tahoma, sans-serif;
            text-align: center;
        }

        .header {
            margin-bottom: 35px;
        }

        h2 {
            font-size: 21px;
            margin: 5px 0 10px;
        }

        .subtitle {
            color: #aab7c4;
            font-size: 13px;
            line-height: 1.8;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 28px 12px;
            max-width: 600px;
            margin: 0 auto;
        }

        .item {
            cursor: pointer;
            color: #ffffff;
            text-decoration: none;
            -webkit-tap-highlight-color: transparent;
            min-width: 0;
        }

        .icon {
            width: 65px;
            height: 65px;
            margin: 0 auto;
            border-radius: 20px;
            background: #2481cc;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 29px;
            transition: transform 0.2s, background 0.2s;
        }

        .item:active .icon {
            transform: scale(0.92);
            background: #1769a8;
        }

        .item p {
            font-size: 12px;
            line-height: 1.8;
            margin: 9px 0 0;
            overflow-wrap: anywhere;
        }

        .footer {
            margin-top: 40px;
            color: #778899;
            font-size: 11px;
        }

        @media (min-width: 600px) {
            .grid {
                grid-template-columns: repeat(4, 1fr);
                gap: 35px 20px;
            }

            .icon {
                width: 75px;
                height: 75px;
                font-size: 32px;
            }

            .item p {
                font-size: 13px;
            }
        }

    </style>
</head>

<body>

    <header class="header">

        <h2>کانون‌های فرهنگی و هنری</h2>

        <div class="subtitle">
            دانشگاه علوم پزشکی شیراز
        </div>

    </header>


    <main>

        <div class="grid" id="channels"></div>

    </main>


    <footer class="footer">
        سامانه معرفی کانون‌های دانشگاه
    </footer>


    <script>

        // Telegram Web App initialization

        const tg = window.Telegram?.WebApp;

        if (tg) {
            tg.ready();
            tg.expand();
        }


        // University student associations

        const channels = [

            {
                name: "کتاب",
                icon: "📚",
                url: "https://t.me/sumsketab"
            },

            {
                name: "نجوم",
                icon: "🔭",
                url: "https://t.me/Sums_Astronomy"
            },

            {
                name: "دوچار",
                icon: "🎭",
                url: "https://t.me/dochar_sums"
            },

            {
                name: "خانه سبز",
                icon: "🌱",
                url: "https://t.me/Sums_Green_House"
            },

            {
                name: "طعم مهر",
                icon: "❤️",
                url: "https://t.me/taamemehr_sums"
            },

            {
                name: "هم‌نوا",
                icon: "🎼",
                url: "https://t.me/hamn_abzz"
            },

            {
                name: "هلال",
                icon: "🌙",
                url: "https://t.me/sumshelal"
            },

            {
                name: "مرکز رسانه",
                icon: "📸",
                url: "https://t.me/MediaCenter_sums"
            },

            {
                name: "گردشگری",
                icon: "🏕️",
                url: "https://t.me/gardeshgari_sums"
            },

            {
                name: "هنر",
                icon: "🎨",
                url: "https://t.me/kanoonhonar_sums"
            },

            {
                name: "کیش اندیش",
                icon: "💡",
                url: "https://t.me/Kishandish_sums"
            },

            {
                name: "تنها نیستی",
                icon: "🤝",
                url: "https://t.me/tanha_nisti313"
            },

            {
                name: "تئاتر",
                icon: "🎬",
                url: "https://t.me/kanoon_theatre"
            },

            {
                name: "انجمن فیلم",
                icon: "🎥",
                url: "https://t.me/AnjomanFilmCh"
            }

        ];


        // Render channels

        const container = document.getElementById("channels");

        channels.forEach(channel => {

            const item = document.createElement("div");
            item.className = "item";

            const icon = document.createElement("div");
            icon.className = "icon";
            icon.textContent = channel.icon;

            const name = document.createElement("p");
            name.textContent = channel.name;

            item.appendChild(icon);
            item.appendChild(name);


            // Open Telegram channel

            item.addEventListener("click", () => {

                if (tg) {
                    tg.openTelegramLink(channel.url);
                } else {
                    window.open(channel.url, "_blank");
                }

            });


            container.appendChild(item);

        });

    </script>

</body>

</html>
